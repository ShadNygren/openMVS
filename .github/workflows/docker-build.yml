name: Docker Build

on:
  push:
    branches: [master, develop, shad/fix-docker]
    paths:
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'libs/**'
      - 'apps/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'docker/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openmvs

jobs:
  build-cpu:
    name: Build CPU Image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=cpu-latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA=0
            BASE_IMAGE=ubuntu:24.04
            RUNTIME_IMAGE=ubuntu:24.04
          cache-from: type=gha,scope=openmvs-cpu
          cache-to: type=gha,mode=max,scope=openmvs-cpu
          provenance: true
          sbom: true

  build-cuda:
    name: Build CUDA Image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-cuda
            type=sha,prefix=,suffix=-cuda
            type=raw,value=cuda-latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA=1
            BASE_IMAGE=nvidia/cuda:12.9.1-devel-ubuntu24.04
            RUNTIME_IMAGE=nvidia/cuda:12.9.1-runtime-ubuntu24.04
          cache-from: type=gha,scope=openmvs-cuda
          cache-to: type=gha,mode=max,scope=openmvs-cuda
          provenance: true
          sbom: true
